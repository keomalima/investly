services:
  - type: web
    name: investly
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DEMO_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: POSTGRESQL_DB_URI
        sync: false
      - key: FINANCIAL_API_KEY
        sync: false
